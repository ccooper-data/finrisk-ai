# Applied by the deploy CodeBuild project, whose access is AmazonEKSEditPolicy scoped to the
# finrisk namespace. The namespace itself is created by the bootstrap project (cluster scope).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finrisk-inference
  namespace: finrisk
spec:
  # No spec.replicas: the HPA owns the replica count, and re-applying a fixed value would fight it.
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      app: finrisk-inference
  template:
    metadata:
      labels:
        app: finrisk-inference
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Writable scratch space; the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: inference
          image: FINRISK_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finrisk-inference
  namespace: finrisk
spec:
  selector:
    app: finrisk-inference
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finrisk-inference
  namespace: finrisk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finrisk-inference
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

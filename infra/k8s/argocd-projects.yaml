# AppProjects bound each Application's source, destination and kinds: an Argo CD guard, not Kubernetes
# least privilege. Only finrisk accepts Applications from outside argocd (from finrisk alone).
#
# default: locked, in case an Application names it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Locked; every FinRisk Application names its own project.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  # An empty list, unlike an absent one, permits no namespaced kind.
  namespaceResourceWhitelist: []
---
# finrisk-monitoring: one OCI chart, into monitoring, only the kinds its lean render contains
# (check_monitoring_stack.py), cluster-scoped ones only under the release's names (name globs).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finrisk-monitoring
  namespace: argocd
spec:
  description: Lean kube-prometheus-stack (operator, kube-state-metrics, Prometheus) in namespace monitoring.
  sourceRepos:
    - oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: "*.monitoring.coreos.com"
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: monitoring-*
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
      name: monitoring-*
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: ServiceMonitor
---
# finrisk: the inference chart from this repository, only its kinds, nothing cluster-scoped.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finrisk
  namespace: argocd
spec:
  description: The FinRisk inference chart from this repository, into namespace finrisk.
  sourceNamespaces:
    - finrisk
  sourceRepos:
    - https://github.com/ccooper-data/finrisk-ai.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: finrisk
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: monitoring.coreos.com
      kind: ServiceMonitor

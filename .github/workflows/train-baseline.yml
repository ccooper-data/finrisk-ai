name: Train temporal baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Download validated full cohort artifact
        uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-cohort-full-36201584816
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 36201584816
      - name: Train chronological logistic baseline
        run: finrisk train-baseline --cohort artifacts/source/sec-cohort-full/sec_labeled_cohort.parquet --out-dir artifacts/modeling/baseline
      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: finrisk-temporal-baseline-${{ github.run_id }}
          path: artifacts/modeling/baseline/
          if-no-files-found: error
          retention-days: 30

name: Analyze SEC filing-era hard cases
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-historical-identity-36252565871
          path: artifacts/source/identity
          github-token: ${{ github.token }}
          run-id: 36252565871
      - run: finrisk analyze-fsds-hardcases --identity artifacts/source/identity/historical_identity_master.parquet --out-dir artifacts/identity/fsds-hardcases --limit 100
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-fsds-hardcases-${{ github.run_id }}
          path: artifacts/identity/fsds-hardcases/
          if-no-files-found: error
          retention-days: 30

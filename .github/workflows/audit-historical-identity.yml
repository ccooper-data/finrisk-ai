name: Audit historical identity master
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-cohort-full-36201584816
          path: artifacts/source/sec
          github-token: ${{ github.token }}
          run-id: 36201584816
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-ticker-map-36207168652
          path: artifacts/source/tickers
          github-token: ${{ github.token }}
          run-id: 36207168652
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-historical-names-36251592145
          path: artifacts/source/names
          github-token: ${{ github.token }}
          run-id: 36251592145
      - run: finrisk audit-historical-identity --cohort artifacts/source/sec/sec-cohort-full/sec_labeled_cohort.parquet --ticker-map artifacts/source/tickers/sec_ticker_map.parquet --historical-names artifacts/source/names/sec_historical_cik_names.parquet --out-dir artifacts/evidence/historical-identity
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-historical-identity-${{ github.run_id }}
          path: artifacts/evidence/historical-identity/
          if-no-files-found: error
          retention-days: 30

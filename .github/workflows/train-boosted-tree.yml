name: Train boosted-tree benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-cohort-full-36201584816
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 36201584816
      - run: finrisk train-boosted-tree --cohort artifacts/source/sec-cohort-full/sec_labeled_cohort.parquet --out-dir artifacts/modeling/boosted-tree
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-boosted-tree-${{ github.run_id }}
          path: artifacts/modeling/boosted-tree/
          if-no-files-found: error
          retention-days: 30

name: Measure Tier-A identifier corroboration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corroborate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-tier-a-identifier-pilot-36285300482
          path: artifacts/source/tier-a
          github-token: ${{ github.token }}
          run-id: 36285300482
      - run: finrisk measure-tier-a-corroboration --evidence artifacts/source/tier-a/tier_a_identifier_evidence.parquet --out-dir artifacts/identity/tier-a-corroboration
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-tier-a-corroboration-${{ github.run_id }}
          path: artifacts/identity/tier-a-corroboration/
          if-no-files-found: error
          retention-days: 30

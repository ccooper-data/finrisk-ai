name: Run Tier-A SEC identifier pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-identifier-retrieval-plan-36280211592
          path: artifacts/source/plan
          github-token: ${{ github.token }}
          run-id: 36280211592
      - run: finrisk run-sec-tier-a-identifier-pilot --targets artifacts/source/plan/identifier_targets.parquet --retrieval-plan artifacts/source/plan/filing_retrieval_plan.parquet --out-dir artifacts/identity/sec-tier-a-identifier-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-sec-tier-a-identifier-pilot-${{ github.run_id }}
          path: artifacts/identity/sec-tier-a-identifier-pilot/
          if-no-files-found: error
          retention-days: 30

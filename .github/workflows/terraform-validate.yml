name: Terraform Static Validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - "charts/**"
      - "infra/tests/**"
      - ".github/workflows/terraform-validate.yml"
      - ".github/workflows/provision-bounded-aws.yml"
      - ".github/workflows/reap-bounded-aws.yml"
      - ".github/workflows/deploy-inference.yml"
      - "docs/aws-bootstrap-policy.json"
      - "docs/aws-bootstrap-trust-policy.json"
      - "docs/aws-eks-boundary-policy.json"
      - "docs/aws-release-policy.json"
      - "docs/aws-release-trust-policy.json"
      - "docs/aws-deployer-deploy-path-policy.json"
      - ".github/workflows/build-inference-image.yml"
      - ".github/workflows/container-validate.yml"
      - "src/finrisk/modeling/boosted_tree.py"
      - ".github/scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "constraints/**"
      - "model/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      # The acceptance scripts need PyYAML. Install it from pyproject like ci.yml, on the same
      # interpreter, rather than relying on whatever the runner image's system Python carries.
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev]'
      - name: Terraform format
        run: |
          terraform -chdir=infra/terraform fmt -recursive
          git diff --exit-code -- infra/terraform || {
            echo "::error::Terraform formatting changed files. Commit the formatter output shown below."
            git diff -- infra/terraform
            exit 1
          }
      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
      - name: Validate GitHub workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          # GitHub rejects duplicate mapping keys; PyYAML silently keeps the last one.
          class StrictLoader(yaml.SafeLoader):
              def construct_mapping(self, node, deep=False):
                  keys = [self.construct_object(k, deep=deep) for k, _ in node.value]
                  dupes = {k for k in keys if keys.count(k) > 1}
                  if dupes:
                      raise yaml.constructor.ConstructorError(None, None, f"duplicate keys {sorted(dupes)}", node.start_mark)
                  return super().construct_mapping(node, deep=deep)

          for path in Path(".github/workflows").glob("*.yml"):
              yaml.load(path.read_text(), Loader=StrictLoader)
              print(f"PASS: {path}")
          PY
      - name: Compile infrastructure acceptance tests
        run: python -m compileall -q infra/tests
      - name: Network architecture acceptance
        run: python infra/tests/test_network_foundation.py
      - name: EKS architecture acceptance
        run: python infra/tests/test_eks_foundation.py
      - name: Plan review hardening acceptance
        run: python infra/tests/test_plan_review_hardening.py
      - name: Second review hardening acceptance
        run: python infra/tests/test_second_review_hardening.py
      - name: Post-validation hardening acceptance
        run: python infra/tests/test_post_validation_hardening.py
      - name: EKS deploy path acceptance
        run: python infra/tests/test_eks_deploy_path.py
      - name: Deploy buildspec runtime acceptance
        run: python infra/tests/test_deploy_buildspec_runtime.py
      - name: Bootstrap buildspec runtime acceptance
        run: python infra/tests/test_bootstrap_buildspec_runtime.py
      - name: Cluster guard acceptance
        run: python infra/tests/test_cluster_guards.py
      - name: Cluster add-ons static acceptance
        run: python infra/tests/test_cluster_addons.py
      - name: Inference image acceptance
        run: python infra/tests/test_inference_image.py
      - name: Inference chart static acceptance
        run: python infra/tests/test_inference_chart.py
      # Pinned, checksum-verified helm, kubeconform, platform charts and the monitoring chart's OCI
      # manifest for the check_*.py acceptance scripts, which fail without them
      # (test_cluster_addons.py pins that each runs here).
      - name: Install pinned helm, kubeconform and charts
        env:
          K8S_TOOLS: ${{ runner.temp }}/k8s-tools
        run: bash .github/scripts/install-k8s-tools.sh "$K8S_TOOLS"
      - name: Inference chart acceptance (lint, kubeconform, Pod Security, manifest parity)
        env:
          K8S_TOOLS: ${{ runner.temp }}/k8s-tools
        run: python infra/tests/check_inference_chart.py
      - name: Cluster guard schema acceptance (kubeconform, policy and dry-run probes)
        env:
          K8S_TOOLS: ${{ runner.temp }}/k8s-tools
        run: python infra/tests/check_cluster_guards.py
      - name: Argo CD install acceptance (render, Pod Security, exposure, RBAC, kubeconform)
        env:
          K8S_TOOLS: ${{ runner.temp }}/k8s-tools
        run: python infra/tests/check_argocd_install.py
      - name: Monitoring stack acceptance (OCI digest, render, AppProject fit, Prometheus hardening)
        env:
          K8S_TOOLS: ${{ runner.temp }}/k8s-tools
        run: python infra/tests/check_monitoring_stack.py
      - name: Worker capacity budget acceptance
        env:
          K8S_TOOLS: ${{ runner.temp }}/k8s-tools
        run: python infra/tests/check_capacity_budget.py
      - name: Cloud security acceptance
        run: python infra/tests/test_security_foundation.py
      - name: Observability and SLO acceptance
        run: python infra/tests/test_observability_foundation.py
      - name: Delivery and rollback acceptance
        run: python infra/tests/test_delivery_recovery.py
      - name: CodeBuild runner script runtime acceptance
        run: python infra/tests/test_run_codebuild_runtime.py
      - name: Final QA evidence acceptance
        run: python infra/tests/test_final_qa_evidence.py
      - name: Live validation harness safety
        run: python infra/tests/test_live_validation_harness.py
      - name: Provision workflow safety
        run: python infra/tests/test_provision_workflow.py
      - name: Bootstrap least-privilege policy acceptance
        run: python infra/tests/test_bootstrap_policy.py

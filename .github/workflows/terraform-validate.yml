name: Terraform Static Validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - "infra/tests/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate
      - name: Compile infrastructure acceptance tests
        run: python -m compileall -q infra/tests
      - name: Network architecture acceptance
        run: python infra/tests/test_network_foundation.py
      - name: EKS architecture acceptance
        run: python infra/tests/test_eks_foundation.py
      - name: Cloud security acceptance
        run: python infra/tests/test_security_foundation.py

name: Preflight EODHD historical access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: finrisk eodhd-preflight > eodhd-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-eodhd-preflight-${{ github.run_id }}
          path: eodhd-preflight.json
          if-no-files-found: error
          retention-days: 30

name: Run five-case 13f coverage probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-historical-identity-36252565871
          path: artifacts/source/identity
          github-token: ${{ github.token }}
          run-id: 36252565871
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-fsds-hardcases-36274638237
          path: artifacts/source/names
          github-token: ${{ github.token }}
          run-id: 36274638237
      - run: python scripts/run_five_case_13f_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-five-case-13f-coverage-${{ github.run_id }}
          path: artifacts/identity/five-case-13f-coverage/
          if-no-files-found: error
          retention-days: 30

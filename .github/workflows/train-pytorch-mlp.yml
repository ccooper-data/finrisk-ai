name: Train PyTorch MLP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,ml]"
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-cohort-full-36201584816
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 36201584816
      - run: finrisk train-pytorch-mlp --cohort artifacts/source/sec-cohort-full/sec_labeled_cohort.parquet --out-dir artifacts/modeling/pytorch-mlp
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-pytorch-mlp-${{ github.run_id }}
          path: artifacts/modeling/pytorch-mlp/
          if-no-files-found: error
          retention-days: 30

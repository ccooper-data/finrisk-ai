name: Provision Bounded AWS Validation

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select plan, apply-reviewed-plan, or destroy"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply-reviewed-plan
          - destroy
      plan_run_id:
        description: "Successful PLAN workflow run ID; required only for apply-reviewed-plan"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: finrisk-bounded-aws-validation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/terraform
  TF_STATE_KEY: finrisk-ai/portfolio/terraform.tfstate
  # The reaper runs at most hourly and destroy takes ~15-20 min, so a 4h lease keeps
  # unattended teardown inside the 6h validation window.
  VALIDATION_MAX_HOURS: "4"

jobs:
  execute:
    environment: portfolio-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # EKS create/delete can approach the 1h default; credentials are not refreshed mid-step.
          # Requires the role's MaxSessionDuration to be at least 7200.
          role-duration-seconds: 7200

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize persistent Terraform state
        run: |
          terraform -chdir="$TF_DIR" init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        run: terraform -chdir="$TF_DIR" validate

      - name: Validate apply source run
        if: inputs.action == 'apply-reviewed-plan'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          test -n "$PLAN_RUN_ID"
          case "$PLAN_RUN_ID" in (*[!0-9]*|"") echo "plan_run_id must be numeric"; exit 1;; esac
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"
          test "$(jq -r '.path' <<<"$run_json")" = ".github/workflows/provision-bounded-aws.yml"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "main"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$CURRENT_SHA"
          test "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch"
          attempt="$(jq -r '.run_attempt' <<<"$run_json")"
          plan_action="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}/attempts/${attempt}/jobs" --jq '.jobs[0].steps[] | select(.name=="Create bounded validation plan") | .conclusion')"
          test "$plan_action" = "success"

      - name: Download authoritative PLAN checksum artifact
        if: inputs.action == 'apply-reviewed-plan'
        uses: actions/download-artifact@v4
        with:
          name: bounded-aws-plan-evidence
          path: reviewed-plan-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}

      # gitops_revision: Argo CD deploys charts/finrisk-inference from this PLAN's own commit. Only PLAN
      # passes it; APPLY uses the reviewed binary plan, and DESTROY and the reaper rely on its null default.
      - name: Create bounded validation plan
        if: inputs.action == 'plan'
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          terraform -chdir="$TF_DIR" plan -out=bounded-validation.tfplan \
            -var="aws_region=$AWS_REGION" \
            -var="monthly_budget_limit_usd=100" \
            -var="enable_eks=true" \
            -var="enable_nat_gateway=true" \
            -var="enable_observability=true" \
            -var="enable_audit_trail=true" \
            -var="gitops_revision=$GITHUB_SHA"
          terraform -chdir="$TF_DIR" show -no-color bounded-validation.tfplan > "$TF_DIR/bounded-validation-plan.txt"
          (cd "$TF_DIR" && sha256sum bounded-validation.tfplan > bounded-validation.tfplan.sha256)

      # The cluster-admin bootstrap buildspec must be in the reviewed plan text in full, pinning Argo CD
      # to this PLAN's commit: the plan's only FINRISK_GITOPS_REVISION line, inside the bootstrap
      # project's block, equal to GITHUB_SHA, and no buildspec "(known after apply)". Before the binary
      # plan is stored, so a plan that fails here can never be applied.
      - name: Verify the plan pins the GitOps revision
        if: inputs.action == 'plan'
        run: |
          plan="$TF_DIR/bounded-validation-plan.txt"
          bootstrap="$(awk '/^  # aws_codebuild_project\.k8s_bootstrap\[0\] /{on=1; next} /^  # /{on=0} on' "$plan")"
          markers="$(grep -c 'FINRISK_GITOPS_REVISION=' "$plan" || true)"
          if [ "$markers" != 1 ] || ! grep -Eqx "[[:space:]]+FINRISK_GITOPS_REVISION=$GITHUB_SHA" <<<"$bootstrap" \
              || grep -Eq 'buildspec +=.*\(known after apply\)' "$plan"; then
            echo "::error::The plan's bootstrap buildspec does not pin Argo CD to $GITHUB_SHA in plain text (markers: $markers)"
            exit 1
          fi
          echo "::notice::Bootstrap buildspec pins Argo CD to $GITHUB_SHA"

      - name: Store private binary plan in state bucket
        if: inputs.action == 'plan'
        run: |
          aws s3 cp "$TF_DIR/bounded-validation.tfplan" "s3://${{ vars.TF_STATE_BUCKET }}/plans/${GITHUB_RUN_ID}/bounded-validation.tfplan"
          aws s3 cp "$TF_DIR/bounded-validation.tfplan.sha256" "s3://${{ vars.TF_STATE_BUCKET }}/plans/${GITHUB_RUN_ID}/bounded-validation.tfplan.sha256"

      - name: Upload redacted plan evidence
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: bounded-aws-plan-evidence
          path: |
            infra/terraform/bounded-validation-plan.txt
            infra/terraform/bounded-validation.tfplan.sha256
          retention-days: 7

      - name: Download exact reviewed private plan
        if: inputs.action == 'apply-reviewed-plan'
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/plans/${{ inputs.plan_run_id }}/bounded-validation.tfplan" "$TF_DIR/bounded-validation.tfplan"
          cp reviewed-plan-evidence/bounded-validation.tfplan.sha256 "$TF_DIR/bounded-validation.tfplan.sha256"
          (cd "$TF_DIR" && sha256sum -c bounded-validation.tfplan.sha256)

      - name: Write teardown lease before apply
        if: inputs.action == 'apply-reviewed-plan'
        run: |
          deadline="$(date -u -d "+${VALIDATION_MAX_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$deadline" > teardown-deadline.txt
          aws s3 cp teardown-deadline.txt "s3://${{ vars.TF_STATE_BUCKET }}/leases/bounded-validation-deadline.txt"
          echo "::notice::Bounded validation teardown deadline: $deadline"

      - name: Apply exact reviewed binary plan
        if: inputs.action == 'apply-reviewed-plan'
        run: terraform -chdir="$TF_DIR" apply -lock-timeout=10m -auto-approve bounded-validation.tfplan

      - name: Record provisioned outputs
        if: inputs.action == 'apply-reviewed-plan'
        run: terraform -chdir="$TF_DIR" output -json > provisioned-outputs.json

      - name: Upload provisioning evidence
        if: inputs.action == 'apply-reviewed-plan'
        uses: actions/upload-artifact@v4
        with:
          name: bounded-aws-provisioning-evidence
          path: |
            provisioned-outputs.json
            teardown-deadline.txt
          retention-days: 7

      - name: Destroy bounded validation environment
        if: inputs.action == 'destroy'
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          terraform -chdir="$TF_DIR" destroy -auto-approve -lock-timeout=10m \
            -var="aws_region=$AWS_REGION" \
            -var="monthly_budget_limit_usd=100" \
            -var="enable_eks=true" \
            -var="enable_nat_gateway=true" \
            -var="enable_observability=true" \
            -var="enable_audit_trail=true"

      - name: Verify destroy state
        if: inputs.action == 'destroy'
        run: |
          remaining="$(terraform -chdir="$TF_DIR" state list)"
          test -z "$remaining" || {
            echo "::error::Terraform state still contains resources after destroy"
            printf '%s\n' "$remaining"
            exit 1
          }

      # Nothing outside Terraform state may outlive the window. In-cluster objects are ClusterIP-only
      # with emptyDir storage, and the bootstrap's server-side dry runs proved live that the exposure
      # guard denies LoadBalancer and externalIPs Services, Ingresses and PVCs. Read-only (the existing
      # ec2:Describe*), and every query filtered to this project or cluster, so no unrelated resource
      # ID is published:
      # - the tagged VPC. A network interface left in its subnets (a load balancer's, or a VPC CNI
      #   one) blocks deleting them, so with no VPC left none remains; if the VPC remains, the
      #   interfaces still in it are listed. The deployer cannot list load balancers directly.
      # - available EBS volumes tagged for this cluster.
      - name: Verify no orphaned AWS resources
        if: inputs.action == 'destroy'
        env:
          CLUSTER: finrisk-ai-portfolio
        run: |
          set -euo pipefail
          vpcs="$(aws ec2 describe-vpcs --filters Name=tag:Project,Values=FinRisk-AI Name=tag:Environment,Values=portfolio --query 'Vpcs[].VpcId' --output text)"
          enis=""
          if [ -n "$vpcs" ]; then
            enis="$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$(tr -s '[:space:]' ',' <<<"$vpcs" | sed 's/,$//')" --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
          fi
          owned="$(aws ec2 describe-volumes --filters Name=status,Values=available "Name=tag-key,Values=kubernetes.io/cluster/$CLUSTER" --query 'Volumes[].VolumeId' --output text)"
          nodes="$(aws ec2 describe-volumes --filters Name=status,Values=available "Name=tag:eks:cluster-name,Values=$CLUSTER" --query 'Volumes[].VolumeId' --output text)"
          volumes="$(printf '%s %s' "$owned" "$nodes" | tr -s '[:space:]' '\n' | sort -u | grep . | paste -sd, - || true)"
          count() { wc -w <<<"$1" | tr -d '[:space:]'; }
          {
            echo "vpc_tagged_remaining=$(count "$vpcs")"
            echo "vpc_enis_remaining=$(count "$enis")"
            echo "available_ebs_volumes=${volumes:-none}"
            echo "load_balancers=not listed (no elasticloadbalancing:Describe*); none possible with vpc_tagged_remaining=0 and the bootstrap's live LoadBalancer denial"
          } | tee teardown-evidence.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$vpcs$enis$volumes" ]; then
            echo "::error::AWS resources outside Terraform state remain after DESTROY (see teardown-evidence.txt); remove them by hand"
            exit 1
          fi

      # Runs only after state is verified empty, so the reaper's fail-safe still covers a
      # partial destroy.
      - name: Clear teardown lease after verified destroy
        if: inputs.action == 'destroy'
        run: aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/leases/bounded-validation-deadline.txt"

      - name: Upload teardown evidence
        if: always() && inputs.action == 'destroy'
        uses: actions/upload-artifact@v4
        with:
          name: bounded-aws-teardown-evidence
          path: teardown-evidence.txt
          if-no-files-found: ignore
          retention-days: 7

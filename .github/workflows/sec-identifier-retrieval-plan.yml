name: Build SEC identifier retrieval plan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-fsds-candidate-strength-36289812345
          path: artifacts/source/strength
          github-token: ${{ github.token }}
          run-id: 36289812345
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-fsds-hardcases-36274638237
          path: artifacts/source/fsds
          github-token: ${{ github.token }}
          run-id: 36274638237
      - run: finrisk build-sec-identifier-retrieval-plan --candidate-strength artifacts/source/strength/candidate_strength.parquet --filing-names artifacts/source/fsds/sec_filing_names.parquet --out-dir artifacts/identity/sec-identifier-retrieval-plan
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-sec-identifier-retrieval-plan-${{ github.run_id }}
          path: artifacts/identity/sec-identifier-retrieval-plan/
          if-no-files-found: error
          retention-days: 30

name: Build FRED macro context
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: finrisk build-fred-macro --start 2008-01-01 --out-dir artifacts/context/fred
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-fred-context-${{ github.run_id }}
          path: artifacts/context/fred/
          if-no-files-found: error
          retention-days: 30

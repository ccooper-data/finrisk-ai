name: Run exploratory macro ablation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-cohort-full-36201584816
          path: artifacts/source/sec
          github-token: ${{ github.token }}
          run-id: 36201584816
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-fred-context-36206412903
          path: artifacts/source/fred
          github-token: ${{ github.token }}
          run-id: 36206412903
      - run: finrisk run-macro-ablation --cohort artifacts/source/sec/sec-cohort-full/sec_labeled_cohort.parquet --macro artifacts/source/fred/fred_macro.parquet --out-dir artifacts/modeling/macro-ablation
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-macro-ablation-${{ github.run_id }}
          path: artifacts/modeling/macro-ablation/
          if-no-files-found: error
          retention-days: 30

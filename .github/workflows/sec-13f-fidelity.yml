name: Probe historical 13f PDF fidelity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts
      - run: pytest -q
      - run: python scripts/probe_sec_13f_pdf_fidelity.py
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-sec-13f-fidelity-${{ github.run_id }}
          path: artifacts/identity/sec-13f-fidelity/
          if-no-files-found: error
          retention-days: 30

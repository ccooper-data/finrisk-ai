name: Build 13f source manifest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts
      - run: pytest -q
      - run: python scripts/build_sec_13f_source_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-13f-source-manifest-${{ github.run_id }}
          path: artifacts/identity/sec-13f-source-manifest/
          if-no-files-found: error
          retention-days: 30

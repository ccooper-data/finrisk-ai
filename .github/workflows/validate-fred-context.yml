name: Validate frozen FRED context
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-fred-context-36206412903
          path: artifacts/context/fred
          github-token: ${{ github.token }}
          run-id: 36206412903
      - run: finrisk validate-fred --context artifacts/context/fred/fred_macro.parquet --out artifacts/context/fred/fred_validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-fred-validation-${{ github.run_id }}
          path: artifacts/context/fred/
          if-no-files-found: error
          retention-days: 30

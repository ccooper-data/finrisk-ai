name: Profile hard-case filing eras
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q src scripts
      - run: pytest -q
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-historical-identity-36252565871
          path: artifacts/source/identity
          github-token: ${{ github.token }}
          run-id: 36252565871
      - run: python scripts/profile_hardcase_eras.py
      - uses: actions/upload-artifact@v4
        with:
          name: finrisk-hardcase-era-profile-${{ github.run_id }}
          path: artifacts/identity/hardcase-era-profile/
          if-no-files-found: error
          retention-days: 30

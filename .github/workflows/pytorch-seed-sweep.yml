name: PyTorch GRU validation seed sweep
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,ml]"
      - run: python -m compileall -q src scripts
      - run: python -c "import torch; print(torch.__version__)"
      - run: pytest -q tests/test_pytorch_seed_sweep.py
      - uses: actions/download-artifact@v4
        with:
          name: finrisk-sec-cohort-full-36626740566
          path: artifacts/source
          github-token: ${{ github.token }}
          run-id: 36626740566
      - run: python scripts/run_pytorch_seed_sweep.py --cohort artifacts/source/sec-cohort-full/sec_labeled_cohort.parquet --out-dir artifacts/modeling/seed-sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finrisk-pytorch-validation-seeds-${{ github.run_id }}
          path: artifacts/modeling/seed-sweep/
          if-no-files-found: warn
          retention-days: 30

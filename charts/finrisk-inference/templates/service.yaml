apiVersion: v1
kind: Service
metadata:
  name: {{ include "finrisk-inference.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finrisk-inference.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "finrisk-inference.selectorLabels" . | nindent 4 }}
  ports:
    # Named for the ServiceMonitor. The target stays a number: a rollout undo restores only the
    # Deployment, and an older Pod template need not name its port.
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

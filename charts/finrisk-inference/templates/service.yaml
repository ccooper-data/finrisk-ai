apiVersion: v1
kind: Service
metadata:
  name: {{ include "finrisk-inference.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finrisk-inference.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "finrisk-inference.selectorLabels" . | nindent 4 }}
  ports:
    # Named for the ServiceMonitor. The target is the container port by number (check_inference_chart.py).
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

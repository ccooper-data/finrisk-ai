# The namespace is the release's, created by the bootstrap project (cluster scope); the chart
# never creates it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finrisk-inference.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "finrisk-inference.labels" . | nindent 4 }}
spec:
  # No spec.replicas: the HPA owns the replica count, and re-applying a fixed value would fight it.
  progressDeadlineSeconds: 240
  selector:
    matchLabels:
      {{- include "finrisk-inference.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finrisk-inference.selectorLabels" . | nindent 8 }}
    spec:
      # The app never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Writable scratch space; the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: inference
          # By digest only; values.schema.json rejects anything but sha256:<64 hex>.
          image: "{{ required "image.repository is required" .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
